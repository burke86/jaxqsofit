name: docs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "notebooks/**"
      - "src/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "notebooks/**"
      - "src/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tutorial-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib
      JAX_PLATFORM_NAME: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      NBSPHINX_EXECUTE: never

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system docs deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install package and docs deps
        run: |
          python -m pip install --upgrade pip
          pip install "jax==0.4.31" "jaxlib==0.4.31" "numpyro==0.19.0"
          pip install -e .
          pip install -r docs/requirements.txt

      - name: Prepare Matplotlib cache
        run: |
          mkdir -p "${MPLCONFIGDIR}"

      - name: Build docs from saved notebook outputs
        run: |
          sphinx-build -b html docs docs/_build/html

      - name: Upload rendered docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html/
