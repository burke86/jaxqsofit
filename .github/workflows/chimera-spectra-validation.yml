name: Chimera spectral validation

# Spectrum-only recovery of stellar mass, AGN bolometric luminosity, SFR and broad
# emission-line FWHM and flux on the Chimera composite spectra with batched MAP + Laplace fits
# (benchmarks/chimera_spectra_validation.py). The spectra and the photometric
# truths come from jaxsedfit's Chimera validation sample; the line truths
# (Wu & Shen 2022) are in benchmarks/data/chimera_line_truth.csv. The job fails if
# any bin with enough objects is past its limit in
# benchmarks/chimera_spectra_validation_thresholds.json. For pull requests from
# branches of this repository it posts (and updates) one compact PR comment with
# the change from main's last run, and the plots behind a fold; runs on main store
# their metrics on the chimera-spectra-validation-plots branch as that baseline.
# Pull requests from forks get a read-only token, so they only get the job summary
# and artifacts.

on:
  pull_request:
    paths:
      - "src/**"
      - "benchmarks/chimera_spectra_validation*"
      - "benchmarks/data/chimera_line_truth.csv"
      - "pyproject.toml"
      - ".github/workflows/chimera-spectra-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "benchmarks/chimera_spectra_validation*"
      - "benchmarks/data/chimera_line_truth.csv"
      - "pyproject.toml"
      - ".github/workflows/chimera-spectra-validation.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: chimera-spectra-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chimera-spectra-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLOT_BRANCH: chimera-spectra-validation-plots
      # jaxsedfit main commit holding the Chimera spectra and the photometric truths.
      SPECTRA_URL: https://raw.githubusercontent.com/burke86/jaxsedfit/31a827491d2c2758b3881a33ba1485bd80b36cd9/benchmarks/data/chimera_validation_spectra.fits
      SAMPLE_URL: https://raw.githubusercontent.com/burke86/jaxsedfit/31a827491d2c2758b3881a33ba1485bd80b36cd9/benchmarks/data/chimera_validation_sample.csv

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore DSPS SSP template cache
        id: cache-dsps-ssp
        uses: actions/cache@v4
        with:
          path: tempdata.h5
          key: dsps-ssp-fsps-v3.2-lgmet-age-v1

      - name: Download DSPS SSP template on cache miss
        if: steps.cache-dsps-ssp.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 6 --retry-delay 15 --retry-all-errors --connect-timeout 60 --max-time 600 \
            https://portal.nersc.gov/project/hacc/aphearin/DSPS_data/ssp_data_fsps_v3.2_lgmet_age.h5 \
            --output tempdata.h5
          test -s tempdata.h5

      - name: Download the Chimera spectra and truths from jaxsedfit
        run: |
          mkdir -p chimera-data
          curl --fail --location --retry 3 --output chimera-data/chimera_validation_spectra.fits "${SPECTRA_URL}"
          curl --fail --location --retry 3 --output chimera-data/chimera_validation_sample.csv "${SAMPLE_URL}"

      - name: Run Chimera spectral validation
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          # glibc keeps a memory pool per thread and rarely returns freed memory (as in
          # jaxsedfit's Chimera validation); two pools cap it.
          MALLOC_ARENA_MAX: "2"
        run: |
          # Log memory use while fitting (GitHub runners have 16 GB).
          ( while sleep 30; do free -m | awk '/Mem/ {print "[mem] used " $3 " MB of " $2 " MB"}'; done ) &
          python benchmarks/chimera_spectra_validation.py run \
            --output-dir chimera-spectra-validation \
            --dsps-ssp-fn tempdata.h5 \
            --spectra chimera-data/chimera_validation_spectra.fits \
            --sample chimera-data/chimera_validation_sample.csv \
            --chunk 4 \
            --slice 128 \
            --isolate-slices \
            --samples 50 \
            --sha "${SHA::7}"

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-spectra-validation
          path: chimera-spectra-validation/
          if-no-files-found: ignore

      - name: Check out the plots branch
        if: env.SAME_REPO == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q plots && cd plots
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin "${PLOT_BRANCH}"; then
            git checkout -q -b "${PLOT_BRANCH}" FETCH_HEAD
          else
            git checkout -q --orphan "${PLOT_BRANCH}"
          fi

      - name: Write the report
        id: report
        run: |
          image_base_url=""
          baseline=""
          if [ "${SAME_REPO}" = "true" ] && [ -n "${PR}" ]; then
            image_base_url="https://raw.githubusercontent.com/${{ github.repository }}/${PLOT_BRANCH}/pr-${PR}/${SHA}"
            [ -f plots/main/metrics.json ] && baseline="plots/main"
          fi
          status=0
          python benchmarks/chimera_spectra_validation.py report \
            --results chimera-spectra-validation \
            ${baseline:+--baseline "${baseline}"} \
            ${image_base_url:+--image-base-url "${image_base_url}"} \
            --sha "${SHA::7}" \
            --output report.md || status=$?
          cat report.md >> "${GITHUB_STEP_SUMMARY}"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"

      - name: Store plots, and main's metrics as the PR baseline
        if: env.SAME_REPO == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${PR}" ]; then dest="pr-${PR}/${SHA}"; else dest="main"; fi
          rm -rf "plots/${dest}" && mkdir -p "plots/${dest}"
          cp chimera-spectra-validation/*.png chimera-spectra-validation/metrics.json "plots/${dest}/"
          cd plots
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Chimera spectral validation for ${dest} (${SHA::7})" || exit 0
          git push -q origin "${PLOT_BRANCH}"

      - name: Create or update the PR comment
        if: env.SAME_REPO == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker="jaxqsofit Chimera spectral validation"
          comment_id="$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\")))][0].id // empty")"
          if [ -n "${comment_id}" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${comment_id}" -F body=@report.md > /dev/null
          else
            gh pr comment "${PR}" --repo "${{ github.repository }}" --body-file report.md
          fi

      - name: Gate on the thresholds
        run: exit "${{ steps.report.outputs.status }}"
