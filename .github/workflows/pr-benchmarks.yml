name: Run benchmarks for PR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdss-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          path: benchmark-head
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout base
        uses: actions/checkout@v4
        with:
          path: benchmark-base
          ref: ${{ github.event.pull_request.base.sha || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # A regular (non-editable) install provides the dependencies, including the
          # PR's jaxsedfit pin; each run below puts one side's jaxqsofit source first
          # on PYTHONPATH.
          pip install ./benchmark-head astroquery

      - name: Restore DSPS SSP template cache
        id: cache-dsps-ssp
        uses: actions/cache@v4
        with:
          path: tempdata.h5
          key: dsps-ssp-fsps-v3.2-lgmet-age-v1

      - name: Download DSPS SSP template on cache miss
        if: steps.cache-dsps-ssp.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 6 --retry-delay 15 --retry-all-errors --connect-timeout 60 --max-time 600 \
            https://portal.nersc.gov/project/hacc/aphearin/DSPS_data/ssp_data_fsps_v3.2_lgmet_age.h5 \
            --output tempdata.h5
          test -s tempdata.h5

      - name: Run benchmarks (alternating base and PR)
        id: bench
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'main' }}
          PR_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p benchmark-artifacts/runs
          bench="python benchmark-head/benchmarks/sdss_pr_benchmark.py"
          run_all() {
            ${bench} fetch --output spectrum.npz || return 1
            for i in 1 2 3 4 5; do
              PYTHONPATH=benchmark-base/src ${bench} measure --spectrum spectrum.npz --label base --sha "${BASE_SHA}" \
                --dsps-ssp-fn tempdata.h5 --output "benchmark-artifacts/runs/base-${i}.json" || return 1
              PYTHONPATH=benchmark-head/src ${bench} measure --spectrum spectrum.npz --label pr --sha "${PR_SHA}" \
                --dsps-ssp-fn tempdata.h5 --output "benchmark-artifacts/runs/pr-${i}.json" || return 1
            done
          }
          status=0
          if run_all; then
            ${bench} report --base "benchmark-artifacts/runs/base-*.json" --pr "benchmark-artifacts/runs/pr-*.json" \
              --output benchmark-artifacts/output || status=$?
          else
            status=1
            printf '### jaxqsofit PR benchmark: ❌ error\n\nA benchmark run crashed; see the [workflow log](%s).\n' \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > benchmark-artifacts/output
          fi
          cat benchmark-artifacts/output >> "${GITHUB_STEP_SUMMARY}"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"

      - name: Store PR number
        if: always() && github.event_name == 'pull_request'
        run: |
          printf "%s" "${{ github.event.pull_request.number }}" > benchmark-artifacts/pr

      - name: Store manual run marker
        if: always() && github.event_name != 'pull_request'
        run: |
          printf "%s" "0" > benchmark-artifacts/pr

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts
          path: benchmark-artifacts/

      # After the upload, so the publish workflow still posts the comment.
      - name: Gate on the limits
        run: exit "${{ steps.bench.outputs.status }}"
